[uwsgi]
# Application module
module = wsgi:application
# Application callable (the Flask app instance name)
callable = application

# Master process
master = true

# Number of worker processes
processes = 4

# Number of threads per worker
threads = 2

# Socket file (for Nginx)
socket = /tmp/ai-tracks.sock
chmod-socket = 666

# HTTP socket (for direct access, comment out if using Nginx)
# http = 0.0.0.0:8000

# Virtual environment path (uncomment and modify if using virtualenv)
# home = /path/to/venv

# Application directory
chdir = /path/to/ai-tracks.com

# Environment variables
env = FLASK_ENV=production

# Process naming
procname-prefix-spaced = ai-tracks

# Logging
logto = /var/log/uwsgi/ai-tracks.log
log-maxsize = 50000000
log-backupname = /var/log/uwsgi/ai-tracks.log.old

# Daemonize (uncomment to run in background)
# daemonize = /var/log/uwsgi/ai-tracks-daemon.log

# PID file
pidfile = /tmp/ai-tracks.pid

# Clean up on exit
vacuum = true

# Die on term signal
die-on-term = true

# Reload on file changes (disable in production)
# py-autoreload = 1

# Maximum number of requests before respawn
max-requests = 5000

# Harakiri timeout (kill workers after this many seconds)
harakiri = 60

# Buffer size
buffer-size = 32768

# Static files (uncomment and configure for serving static files via uWSGI)
# static-map = /static=./static
# static-map = /uploads=./uploads

# Cheaper mode for dynamic worker scaling
cheaper = 2
cheaper-initial = 2
cheaper-step = 1

